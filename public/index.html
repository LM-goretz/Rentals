<!doctype html>
<html>
<head><meta charset="utf-8"><title>Greenwood - Home</title></head>
<body>
<h1>Available Houses</h1>
<div id="list"></div>
<p><a href="signin.html">Sign in</a> | <a href="signup.html">Sign up</a> | <a href="admin.php">Admin</a></p>
<script>
async function fetchHouses(){
  const res = await fetch('../gethouses.php');
  const data = await res.json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  data.forEach(h => {
    const d = document.createElement('div');
    d.innerHTML = '<h3>'+h.title+' - KES '+h.rent+'</h3><p>'+ (h.description||'') +'</p><small>Owner: '+(h.owner_name||'')+'</small>';
    if (h.images && h.images.length) {
        const g = document.createElement('div');
        h.images.forEach(img => {
            const imgEl = document.createElement('img');
            imgEl.src = '../uploads/' + img;
            imgEl.style.maxWidth = '200px';
            imgEl.style.marginRight = '6px';
            g.appendChild(imgEl);
        });
        d.appendChild(g);
    }
    list.appendChild(d);
  });
}
fetchHouses();
</script>
</body>
</html>
